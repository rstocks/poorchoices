backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master
collections:
  - name: "posts" # Used in routes, e.g., /admin/collections/blog
    label: "Posts" # Used in the UI
    folder: "src/posts/2026" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "dek", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Regret", name: "regret", widget: "number", value_type: "int", default: 2, min: 1, max: 10, step: 1 }
      - { label: "Would do again?", name: "would_do_again", widget: "boolean" }
      - { label: "Lesson", name: "lesson", widget: "string" }
      - { label: "Cost", name: "cost", widget: "string" }
      - { label: "Body", name: "body", widget: "richtext" }
